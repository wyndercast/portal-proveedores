# App Platform specification for the backend.
# Runtime secrets remain managed in DigitalOcean and are not stored here.
name: portal-proveedores
region: nyc

services:
  - name: portal-proveedores-backend
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    image:
      registry_type: DOCR
      registry: portal-proveedores-backend
      repository: portal-proveedores-backend
      digest: sha256:de59c57f2452f5f81801ad503aa6e7ba8f8a0259c6bb5304e2eefe5178f6f03a
      deploy_on_push: false
    health_check:
      http_path: /actuator/health
      port: 8080
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: VALUEKEEP_BASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: VALUEKEEP_TOKEN_URL
        scope: RUN_TIME
        type: SECRET
      - key: VALUEKEEP_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: VALUEKEEP_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
