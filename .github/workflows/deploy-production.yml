name: Backend Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA previously validated by Backend CI'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate input format
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "${INPUT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'commit_sha must be a full 40-character SHA.' >&2
            exit 1
          fi
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit belongs to master
        id: commit
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin master --depth=1
          git cat-file -e "${INPUT_SHA}^{commit}"
          git merge-base --is-ancestor "${INPUT_SHA}" origin/master
          echo "sha=${INPUT_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Verify successful CI for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          result="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=master&head_sha=${INPUT_SHA}" \
            --jq '[.workflow_runs[] | select(.head_sha == "'"${INPUT_SHA}"'") | select(.status == "completed" and .conclusion == "success")] | length' \
            | tail -n 1)"
          if [[ "${result}" != '1' ]]; then
            echo "No successful Backend CI run found for ${INPUT_SHA}." >&2
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0
      - name: Block placeholder App Platform configuration
        run: |
          if grep -R "REPLACE_ME" -n .do/app.yaml; then
            echo 'DigitalOcean app spec still contains placeholders; deployment is blocked before publishing an image.' >&2
            exit 1
          fi
      - name: Validate production secrets
        env:
          APP_ID: ${{ secrets.DIGITALOCEAN_BACKEND_APP_ID }}
          REGISTRY: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}
          IMAGE_REPOSITORY: ${{ secrets.DIGITALOCEAN_BACKEND_IMAGE_REPOSITORY }}
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.DIGITALOCEAN_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DIGITALOCEAN_REGISTRY_PASSWORD }}
        run: |
          for value in APP_ID REGISTRY IMAGE_REPOSITORY DO_TOKEN REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing production secret: ${value}" >&2
              exit 1
            fi
          done
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test exact commit
        run: ./mvnw -B test
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_REGISTRY_USERNAME }}
          password: ${{ secrets.DIGITALOCEAN_REGISTRY_PASSWORD }}
      - name: Build and push immutable SHA image
        env:
          IMAGE: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}/${{ secrets.DIGITALOCEAN_BACKEND_IMAGE_REPOSITORY }}:${{ needs.validate.outputs.commit_sha }}
        run: docker build --push --tag "${IMAGE}" .
      - name: Resolve image digest
        env:
          IMAGE: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}/${{ secrets.DIGITALOCEAN_BACKEND_IMAGE_REPOSITORY }}:${{ needs.validate.outputs.commit_sha }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ -z "${digest}" || "${digest}" == '<no value>' ]]; then
            echo 'Could not resolve an immutable image digest.' >&2
            exit 1
          fi
          echo "Published ${IMAGE}@${digest} for ${GITHUB_SHA}"
      - name: Block until DigitalOcean app update is configured
        run: |
          echo 'Image publication is prepared, but the DigitalOcean app update and rollback procedure require approved real configuration.' >&2
          echo 'No production deployment was executed.' >&2
          exit 1
