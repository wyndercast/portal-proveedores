name: Backend Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA previously validated by Backend CI'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate input format
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "${INPUT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'commit_sha must be a full 40-character SHA.' >&2
            exit 1
          fi
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit belongs to master
        id: commit
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin master --depth=1
          git cat-file -e "${INPUT_SHA}^{commit}"
          git merge-base --is-ancestor "${INPUT_SHA}" origin/master
          echo "sha=${INPUT_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Verify successful CI for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          result="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=master&head_sha=${INPUT_SHA}" \
            --jq '[.workflow_runs[] | select(.head_sha == "'"${INPUT_SHA}"'") | select(.status == "completed" and .conclusion == "success")] | length' \
            | tail -n 1)"
          if [[ "${result}" != '1' ]]; then
            echo "No successful Backend CI run found for ${INPUT_SHA}." >&2
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0
      - name: Block placeholder App Platform configuration
        run: |
          if grep -R "REPLACE_ME" -n .do/app.yaml; then
            echo 'DigitalOcean app spec still contains placeholders; deployment is blocked before publishing an image.' >&2
            exit 1
          fi
      - name: Validate production secrets
        env:
          APP_ID: ${{ secrets.DIGITALOCEAN_BACKEND_APP_ID }}
          REGISTRY: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}
          IMAGE_REPOSITORY: ${{ secrets.DIGITALOCEAN_BACKEND_IMAGE_REPOSITORY }}
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.DIGITALOCEAN_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DIGITALOCEAN_REGISTRY_PASSWORD }}
        run: |
          for value in APP_ID REGISTRY IMAGE_REPOSITORY DO_TOKEN REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing production secret: ${value}" >&2
              exit 1
            fi
          done
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test exact commit
        run: mvn -B test
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_REGISTRY_USERNAME }}
          password: ${{ secrets.DIGITALOCEAN_REGISTRY_PASSWORD }}
      - name: Build and push immutable SHA image
        env:
          IMAGE: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}/${{ secrets.DIGITALOCEAN_BACKEND_IMAGE_REPOSITORY }}:${{ needs.validate.outputs.commit_sha }}
        run: docker build --push --tag "${IMAGE}" .
      - name: Resolve image digest
        id: image
        env:
          IMAGE: ${{ secrets.DIGITALOCEAN_CONTAINER_REGISTRY }}/${{ secrets.DIGITALOCEAN_BACKEND_IMAGE_REPOSITORY }}:${{ needs.validate.outputs.commit_sha }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ -z "${digest}" || "${digest}" == '<no value>' ]]; then
            echo 'Could not resolve an immutable image digest.' >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published ${IMAGE}@${digest} for ${GITHUB_SHA}"
      - name: Update App Platform image while preserving the existing app spec
        id: app_update
        env:
          APP_ID: ${{ secrets.DIGITALOCEAN_BACKEND_APP_ID }}
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COMPONENT_NAME: portal-proveedores-backend
        run: |
          set -euo pipefail
          app_json="$(mktemp)"
          payload="$(mktemp)"
          app_response="$(mktemp)"
          trap 'rm -f "${app_json}" "${payload}" "${app_response}"' EXIT

          if [[ ! "${APP_ID}" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo 'DIGITALOCEAN_BACKEND_APP_ID must be a UUID.' >&2
            exit 1
          fi

          app_http_code="$(curl --silent --show-error \
            -H "Authorization: Bearer ${DO_TOKEN}" \
            -H 'Accept: application/json' \
            --output "${app_response}" \
            --write-out '%{http_code}' \
            "https://api.digitalocean.com/v2/apps/${APP_ID}")"
          if [[ "${app_http_code}" != 2* ]]; then
            echo "DigitalOcean app lookup failed with HTTP ${app_http_code}:" >&2
            jq -c . "${app_response}" 2>/dev/null || cat "${app_response}"
            exit 1
          fi
          cp "${app_response}" "${app_json}"

          previous_deployment="$(jq -r '.app.active_deployment.id // empty' "${app_json}")"
          echo "previous_deployment=${previous_deployment}" >> "${GITHUB_OUTPUT}"

          jq --arg component "${COMPONENT_NAME}" --arg digest "${IMAGE_DIGEST}" \
            '{spec: (.app.spec
              | .services = (.services | map(
                  if .name == $component
                  then .image = (.image + {digest: $digest, deploy_on_push: {enabled: false}} | del(.tag))
                  else .
                  end))) }' "${app_json}" > "${payload}"

          response="$(mktemp)"
          trap 'rm -f "${app_json}" "${payload}" "${app_response}" "${response}"' EXIT
          http_code="$(curl --silent --show-error --request PUT \
            -H "Authorization: Bearer ${DO_TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary "@${payload}" \
            --output "${response}" \
            --write-out '%{http_code}' \
            "https://api.digitalocean.com/v2/apps/${APP_ID}")"
          if [[ "${http_code}" != 2* ]]; then
            echo "DigitalOcean App Platform update failed with HTTP ${http_code}:" >&2
            jq -c . "${response}" 2>/dev/null || cat "${response}"
            exit 1
          fi
          jq -e --arg app_id "${APP_ID}" '.app.id == $app_id' "${response}" > /dev/null

          echo "App Platform spec updated to digest ${IMAGE_DIGEST}."
      - name: Wait for App Platform deployment
        env:
          APP_ID: ${{ secrets.DIGITALOCEAN_BACKEND_APP_ID }}
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          PREVIOUS_DEPLOYMENT: ${{ steps.app_update.outputs.previous_deployment }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            deployment="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${DO_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.digitalocean.com/v2/apps/${APP_ID}/deployments?per_page=1" \
              | jq -r '.deployments[0].id // empty')"
            if [[ -z "${deployment}" || "${deployment}" == "${PREVIOUS_DEPLOYMENT}" ]]; then
              echo 'Waiting for the new App Platform deployment to be created.'
              sleep 10
              continue
            fi
            phase="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${DO_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.digitalocean.com/v2/apps/${APP_ID}/deployments/${deployment}" \
              | jq -r '.deployment.phase // empty')"

            echo "Deployment ${deployment:-pending}: ${phase:-PENDING}"
            case "${phase}" in
              ACTIVE) echo "App Platform deployment is active."; exit 0 ;;
              ERROR|CANCELED) echo "App Platform deployment failed with phase ${phase}." >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for App Platform deployment.' >&2
          exit 1
      - name: Verify backend health
        env:
          BACKEND_PUBLIC_URL: https://portal-proveedores-u74ef.ondigitalocean.app
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "${BACKEND_PUBLIC_URL}/actuator/health" \
            | jq -e '.status == "UP"' > /dev/null
          echo 'Backend health check passed.'
