name: Backend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Show validated SHA
        run: echo "Validating commit ${GITHUB_SHA}"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: |
          set -euo pipefail
          if mvn -B -o test; then
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Maven online retry ${attempt}/3"
            if mvn -B -Dmaven.wagon.http.retryHandler.count=3 test; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
